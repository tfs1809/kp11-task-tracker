{% if page_obj.has_other_pages %}<nav class="pagination" aria-label="Страницы списка">{% if page_obj.has_previous %}<a href="?{{ pagination_query }}&amp;page={{ page_obj.previous_page_number }}">Предыдущая</a>{% endif %}<span>Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="?{{ pagination_query }}&amp;page={{ page_obj.next_page_number }}">Следующая</a>{% endif %}</nav>{% endif %}
