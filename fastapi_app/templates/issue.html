{% extends 'base.html' %}{% block content %}<section class="card"><h1>Создать задачу</h1>{% if error %}<p class="notice error-summary">{{ error }}</p>{% endif %}<form method="post" action="/workitems/new/"><input type="hidden" name="csrf_token" value="{{ csrf }}"><div class="form-field"><label for="title">Название</label><input id="title" name="title" maxlength="255" required value="{{ values.title or '' }}"></div><div class="form-field"><label for="description">Описание</label><textarea id="description" name="description" maxlength="10000">{{ values.description or '' }}</textarea></div><div class="form-field"><label for="kind">Тип</label><select id="kind" name="kind"><option value="task">Задача</option><option value="event">Событие</option></select></div><div class="form-field"><label for="due_at">Срок до</label><input id="due_at" name="due_at" type="datetime-local" required></div><div class="form-field"><label for="event_at">Дата события</label><input id="event_at" name="event_at" type="datetime-local"></div><button type="submit">Создать</button></form><p><a href="/">Мои задачи</a></p></section>{% endblock %}
