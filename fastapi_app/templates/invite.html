{% extends 'base.html' %}{% block content %}<section class="card"><h1>Пригласить сотрудника</h1>{% if message %}<p class="notice" role="status">{{ message }}</p>{% endif %}{% if error %}<p class="notice error-summary" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/accounts/invite/"><input type="hidden" name="csrf_token" value="{{ csrf }}"><div class="form-field"><label for="email">Почта</label><input id="email" name="email" type="email" required value="{{ values.email or '' }}"></div><div class="form-field"><label for="full_name">ФИО</label><input id="full_name" name="full_name" required value="{{ values.full_name or '' }}"></div><button type="submit">Пригласить</button></form></section>{% endblock %}
