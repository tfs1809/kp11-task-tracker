{% extends 'base.html' %}{% block content %}<section class="card"><h1>Восстановление доступа</h1>{% if message %}<p class="notice" role="status">{{ message }}</p>{% endif %}{% if error %}<p class="notice error-summary" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/accounts/recovery/"><input type="hidden" name="csrf_token" value="{{ csrf }}"><div class="form-field"><label for="email">Почта</label><input id="email" name="email" type="email" required autocomplete="email" value="{{ email or '' }}"></div><button type="submit">Отправить письмо</button></form><p><a href="/accounts/login/">Вернуться ко входу</a></p></section>{% endblock %}
