{% extends 'base.html' %}{% block content %}<section class="card"><h1>Сотрудник</h1>{% if message %}<p class="notice" role="status">{{ message }}</p>{% endif %}{% if error %}<p class="notice error-summary" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/accounts/users/{{ employee.id }}/"><input type="hidden" name="csrf_token" value="{{ csrf }}"><div class="form-field"><label for="full_name">ФИО</label><input id="full_name" name="full_name" required value="{{ employee.full_name }}"></div><label><input type="checkbox" name="is_active" value="true" {% if employee.is_active %}checked{% endif %}> Учетная запись активна</label><button type="submit">Сохранить</button></form></section>{% endblock %}
