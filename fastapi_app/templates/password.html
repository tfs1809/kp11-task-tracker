{% extends 'base.html' %}{% block content %}<section class="card"><h1>{{ title }}</h1>{% if message %}<p class="notice" role="status">{{ message }}</p>{% endif %}{% if error %}<p class="notice error-summary" role="alert">{{ error }}</p>{% endif %}{% if not finished %}<form method="post" action="{{ action }}"><input type="hidden" name="csrf_token" value="{{ csrf }}">{% if token %}<input type="hidden" name="token" value="{{ token }}">{% endif %}{% if change %}<div class="form-field"><label for="old_password">Текущий пароль</label><input id="old_password" name="old_password" type="password" required autocomplete="current-password"></div>{% endif %}<div class="form-field"><label for="password">Новый пароль</label><input id="password" name="password" type="password" minlength="12" required autocomplete="new-password"></div><div class="form-field"><label for="password_confirm">Повторите пароль</label><input id="password_confirm" name="password_confirm" type="password" minlength="12" required autocomplete="new-password"></div><button type="submit">Сохранить</button></form>{% endif %}</section>{% endblock %}
