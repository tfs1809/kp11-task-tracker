<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title or 'Трек задач КП11' }}</title><link rel="stylesheet" href="/static/css/base.css"><script src="/static/js/forms.js" defer></script></head>
<body><a class="skip-link" href="#main">Перейти к содержимому</a><header class="site-header"><div class="header-inner"><a class="brand" href="/">Трек задач КП11</a>{% if user %}<nav aria-label="Основная навигация"><a href="/" {% if active == 'home' %}aria-current="page"{% endif %}>Мои задачи</a><a href="/workitems/issued/" {% if active == 'issued' %}aria-current="page"{% endif %}>Выдано мной</a><a href="/accounts/profile/" {% if active == 'profile' %}aria-current="page"{% endif %}>Профиль</a>{% if is_admin %}<a href="/accounts/administration/" {% if active == 'administration' %}aria-current="page"{% endif %}>Администрирование</a>{% endif %}</nav><div class="account-actions"><form method="post" action="/accounts/logout/"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button class="nav-logout" type="submit">Выход</button></form></div>{% else %}<a href="/accounts/login/">Вход</a>{% endif %}</div></header><main id="main" tabindex="-1">{% block content %}{% endblock %}</main><footer>Время указано по Москве · Доступ только для сотрудников</footer></body></html>
