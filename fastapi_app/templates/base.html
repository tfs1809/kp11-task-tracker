<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title or 'Трек задач КП11' }}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/css/base.css"><script src="/static/js/forms.js" defer></script></head>
<body><a class="skip-link" href="#main">Перейти к содержимому</a><header class="site-header"><div class="header-inner"><a class="brand" href="/">Трек задач КП11</a>{% if user %}<nav class="{% if can_system %}nav-admin{% endif %}" aria-label="Основная навигация"><a href="/" {% if active == 'home' %}aria-current="page"{% endif %}>Мои задачи</a>{% if can_issue %}<a href="/workitems/issued/" {% if active == 'issued' %}aria-current="page"{% endif %}>Выдано мной</a>{% endif %}<a href="/accounts/profile/" {% if active == 'profile' %}aria-current="page"{% endif %}>Профиль</a>{% if can_system %}<a href="/accounts/system/" {% if active == 'system' %}aria-current="page"{% endif %}>Система</a>{% endif %}<form class="nav-logout-form" method="post" action="/accounts/logout/"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button class="nav-logout" type="submit">Выйти</button></form></nav>{% else %}<a class="login-link" href="/accounts/login/">Войти</a>{% endif %}</div></header><main id="main" tabindex="-1">{% block content %}{% endblock %}</main><footer>Время указано по Москве · Доступ только для сотрудников</footer></body></html>
