{% extends 'base.html' %}{% block content %}<section class="card"><h1>{{ title }}</h1>{% if error %}<p class="notice error-summary" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/accounts/login/"><input type="hidden" name="csrf_token" value="{{ csrf }}"><div class="form-field"><label for="email">Почта</label><input id="email" name="email" type="email" required autocomplete="username" value="{{ email or '' }}"></div><div class="form-field"><label for="password">Пароль</label><input id="password" name="password" type="password" required autocomplete="current-password"></div><button type="submit">Войти</button></form><p>Доступ только по приглашению администратора.</p><p><a href="/accounts/recovery/">Забыли пароль?</a></p></section>{% endblock %}
